[static_params]
pulse_model    = norris()
spectral_model = Band()

[prior-epeak]
name = uniform
min  = 100
max  = 1000

[prior-l0] #From Salafia et al. 2023 https://doi.org/10.1051/0004-6361/202347298
name = uniform-log
min = 3e51
max = 1e55

[prior-alpha] #https://arxiv.org/pdf/2103.13528 FIGURE 15 ? 
name = gaussian
mean = -0.46
var  = 0.37

[prior-beta] #https://arxiv.org/pdf/2103.13528 FIGURE 17 ? 
name  = gaussian
mean  = -2.3
var   = 0.5

[prior-t_rise]
name = uniform
min  = 0.01
max  = 1

[prior-t_decay]
name = uniform
min  = 0.01
max  = 1

[prior-opening_angle]
name = uniform
min  = 0
max  = 25